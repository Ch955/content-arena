// Pinky's anger (0..1): red face, steam, the meter
function angerAt(t){const k=K;
  if(t<k.tLand) return 0;
  if(t<S(3)) return [0.35,0.7,1][Math.min(2,Math.floor((t-k.tLand)/((E(2)-k.tLand)/3)))]*1;
  if(t<S(4)) return 1;
  if(t<S(6)) return lerp(1,0.4,clamp((t-S(4))/(E(5)-S(4))));
  if(t<k.tShout) return 0.35;
  if(t<k.tBreath) return lerp(0.35,1,out((t-k.tShout)/0.25));
  if(t<E(10)+0.3) return lerp(1,0.2,clamp((t-k.tBreath)/(E(10)-k.tBreath)));
  if(t<k.tSlam) return 0.2+0.25*clamp((t-k.CD1)/0.6);
  if(t<S(13)) return lerp(0.45,1,out((t-k.tSlam)/0.2));
  if(t<k.tCalm) return 0.9;
  return lerp(0.9,0,ease((t-k.tCalm)/1.6));
}
function meterAt(t){const k=K, a=angerAt(t);
  if(t<k.tLand) return 0.05;
  if(t<S(3)) return lerp(0.05,0.97,out((t-k.tLand)/(E(2)-k.tLand)));
  if(t<S(4)) {const w=Math.exp(-(t-S(3))*3); return 0.95+0.05*Math.sin(t*30)*w}
  if(t>=k.CD1&&t<S(13)) return t<k.tSlam?0.45:Math.min(1,lerp(0.45,1.06,out((t-k.tSlam)/0.2)))+0.02*Math.sin(t*40)*Math.exp(-(t-k.tSlam)*3);
  if(t>=S(13)&&t<k.tCalm) return 0.97;
  if(t>=k.tCalm) return lerp(0.97,0.04,ease((t-k.tCalm)/1.6));
  return Math.max(0.05,a);
}

    if(whip>0.05&&beat==="hook"){const y=300+i*95; ln.setAttribute("x1",-100+((i*137)%300)); ln.setAttribute("x2",500+((i*211)%600)); ln.setAttribute("y1",y); ln.setAttribute("y2",y); ln.style.opacity=whip*0.8}});
  conf.forEach((c,i)=>{const t0=k.tAns+0.05, q=t-t0; const on=q>0&&q<2.4; const x0=(i*97)%1080, vx=((i*53)%11-5)*14;
    c.setAttribute("x",x0+vx*q+Math.sin(q*4+i)*30); c.setAttribute("y",-60+q*(420+(i%7)*60)-(i%5)*40); c.setAttribute("transform",`rotate(${q*200+i*30} ${x0+vx*q} ${-60+q*(420+(i%7)*60)})`); c.style.opacity=on?Math.min(1,(2.4-q)/0.5):0});
  document.getElementById("flash").style.opacity=(t>k.CD1&&t<k.CD1+0.25?0.6*(1-(t-k.CD1)/0.25):0)+(t>k.tAns&&t<k.tAns+0.15?0.5*(1-(t-k.tAns)/0.15):0)+(t>k.tWho&&t<k.tWho+0.12?0.35*(1-(t-k.tWho)/0.12):0);
  const ti=document.getElementById("title"); ti.style.opacity=t<0.15?0:t<S(1)-0.4?1:clamp(1-(t-S(1)+0.4)/0.3); ti.style.transform=`scale(${Math.max(0.01,back((t-0.15)/0.5))}) rotate(${Math.sin(t*2.5)*1.2}deg)`;
  const ho=document.getElementById("hold"); const hq2=t-k.tWatch+0.1; ho.style.opacity=fade(t,k.tWatch-0.1,S(2)+0.5,0.2);
  ho.style.transform=`scale(${Math.max(0.01,back(hq2/0.4))*(1+0.12*Math.exp(-hq2*5)*Math.sin(hq2*30))},${Math.max(0.01,back(hq2/0.4))*(1-0.12*Math.exp(-hq2*5)*Math.sin(hq2*30))}) rotate(${-2+Math.sin(t*3)*1.5}deg)`;   // clay squish
  const an=document.getElementById("ans"); an.style.opacity=fade(t,k.tAns-0.05,S(14)-0.15,0.15); an.style.transform=`scale(${Math.max(0.01,back((t-k.tAns+0.05)/0.4))})`;
  const skk=document.getElementById("stk"); skk.style.opacity=fade(t,k.tTick-0.1,S(16)+0.2,0.1); skk.style.transform=`scale(${Math.max(0.01,lerp(2.2,1,out((t-k.tTick+0.1)/0.2)))}) rotate(${12+Math.sin(t*3)*2}deg)`;
  const en=document.getElementById("end"); en.style.opacity=t>k.tFollow-0.1?clamp((t-k.tFollow+0.1)/0.3):0; en.style.transform=`translateY(${(1-out((t-k.tFollow+0.1)/0.5))*40}px)`;
  const ec=document.getElementById("endC"); ec.style.opacity=1; ec.style.transform=`scale(${Math.max(0.01,back((t-k.tFollow)/0.35))})`;
  const ef=document.getElementById("endF"); ef.style.opacity=t>k.tFollow+0.1?1:0; ef.style.transform=`scale(${Math.max(0.01,back((t-k.tFollow-0.1)/0.4))})`;
  const er=document.getElementById("endR"); er.style.opacity=t>k.tRepu-0.1?1:0; er.style.transform=`scale(${Math.max(0.01,back((t-k.tRepu+0.1)/0.4))*(1+0.03*Math.sin(t*6))})`;
  // subtitles
  const sub=document.getElementById("sub"), L=curLine(t);
  if(L){sub.style.opacity=1; sub.innerHTML=`<span class="who" style="background:${COLORS[L.who]}">${NAMES[L.who]}</span><br>${L.text.replace(/…/g,"...")}`} else sub.style.opacity=0;
};
</script>
</body></html>
