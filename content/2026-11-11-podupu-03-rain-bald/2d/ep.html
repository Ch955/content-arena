  const yF=300+60, yS=300+60+150;
  let hxp=860,hyp=820; const mv=(a,b,k)=>[lerp(a[0],b[0],ease(k)),lerp(a[1],b[1],ease(k))];
  if(t<tTapF){[hxp,hyp]=mv([860,820],[560,yF],(t-sh3-0.1)/Math.max(0.3,tTapF-sh3-0.25))}
  else if(t<tTapS){[hxp,hyp]=mv([560,yF],[560,yS],(t-tTapF-0.25)/Math.max(0.3,tTapS-tTapF-0.4))}
  else {[hxp,hyp]=mv([560,yS],[880,820],(t-tTapS-0.3)/0.4)}
  const dip=Math.max(0,1-Math.abs(t-tTapF)/0.1)+Math.max(0,1-Math.abs(t-tTapS)/0.1);
  hand.style.opacity=fOn?clamp(Math.min((t-sh3-0.05)/0.15,(sh4-t)/0.15)):0;
  hand.style.transform=`translate(${hxp-50}px,${hyp-8+dip*10}px) scale(${1-0.1*dip}) rotate(${-8+dip*6}deg)`;
  const rT=t>=tTapS?tTapS:tTapF, rk=(t-rT)/0.45; ring.style.opacity=fOn&&rk>0&&rk<1?1-rk:0;
  ring.style.left="560px"; ring.style.top=(rT===tTapS?yS:yF)+"px"; ring.style.transform=`scale(${1+rk*5})`;
  // countdown overlay
  const clock=document.getElementById("clock"), dig=document.getElementById("digit"), cn=document.getElementById("cnow");
  const cOn=shot===5; const cIn=clamp(cdk/0.3)*clamp((TL.countdown-cdk)/0.25);
  clock.style.opacity=cOn?cIn:0; cn.style.opacity=cOn?cIn:0;
  if(cOn){const hnd=document.getElementById("hand"), tick=Math.min(1,fr/0.08);
    hnd.setAttribute("transform",`rotate(${(sec+tick)*72})`);
    document.getElementById("arc").setAttribute("stroke-dasharray",`${389.6*(1-cdk/TL.countdown)} 389.6`);
    document.getElementById("clockBody").setAttribute("transform",`rotate(${Math.exp(-fr*7)*Math.sin(fr*60)*9}) scale(${1+Math.exp(-fr*8)*0.08})`);
    const n=Math.max(1,5-sec); dig.textContent=n; dig.style.opacity=fr<0.82?1:clamp(1-(fr-0.82)/0.18);
    dig.style.transform=`scale(${lerp(1.5,1,out(fr/0.22))})`; dig.style.color=n<=2?"#FF5252":"#F5B700";
    cn.style.transform=`scale(${1+0.05*Math.sin(t*Math.PI*4)})`;
  } else dig.style.opacity=0;
  vigR.style.opacity=shot===5?clamp(cdk/1.5)*0.8:0;
  streaks.forEach((ln,i)=>{const on=shot===6&&t<CD1+0.4; const a=i/14*Math.PI*2, r0_=260+((t*900+i*37)%300);
    ln.setAttribute("x1",540+Math.cos(a)*r0_);ln.setAttribute("y1",760+Math.sin(a)*r0_);ln.setAttribute("x2",540+Math.cos(a)*(r0_+180));ln.setAttribute("y2",760+Math.sin(a)*(r0_+180));ln.style.opacity=on?0.75:0});
  conf.forEach((c,i)=>{const t0=tBan+0.05, k=t-t0; const on=k>0&&k<3.2; const x0=(i*97)%1080, vx=((i*53)%11-5)*14;
    c.setAttribute("x",x0+vx*k+Math.sin(k*4+i)*30); c.setAttribute("y",-60+k*(420+(i%7)*60)-(i%5)*40); c.setAttribute("transform",`rotate(${k*200+i*30} ${x0+vx*k} ${-60+k*(420+(i%7)*60)})`); c.style.opacity=on?Math.min(1,(3.2-k)/0.6):0});
  document.getElementById("flash").style.opacity=lf*0.35+(t>CD1&&t<CD1+0.25?0.85*(1-(t-CD1)/0.25):0)+(t>tBan&&t<tBan+0.12?0.4*(1-(t-tBan)/0.12):0);
  // share animation (screen space)
  const shOn=shot===7&&t>S(12)-0.1&&t<tFol+0.5;
  shareG.style.opacity=shOn?clamp(Math.min((t-S(12)+0.1)/0.2,(tFol+0.5-t)/0.3)):0;
  shareG.setAttribute("transform",`translate(${SHX},${SHY})`);
  const sdip=Math.max(0,1-Math.abs(t-tShTap)/0.1);
  shBtn.setAttribute("transform",`scale(${Math.max(0.01,back((t-S(12)+0.1)/0.35))*(1-0.1*sdip)})`);
  const shk=(t-tShTap)/0.45; shRing.style.opacity=shk>0&&shk<1?1-shk:0; shRing.setAttribute("r",64+shk*70);
  const hIn=ease((t-S(12)+0.1)/Math.max(0.2,tShTap-S(12)));
  shHand.style.opacity=t<tShTap+0.4?1:clamp(1-(t-tShTap-0.4)/0.2);
  shHand.setAttribute("transform",`translate(${lerp(240,24,hIn)},${lerp(200,0,hIn)+sdip*10}) rotate(-10)`);
  FR.forEach(([x,y],i)=>{const t0=tShTap+0.15+i*0.18, k=clamp((t-t0)/0.5), fx_=x-SHX, fy_=y-SHY;
    const cx=fx_*k, cy=fy_*k-Math.sin(k*Math.PI)*120;
    planes[i].style.opacity=k>0&&k<1?1:0; planes[i].setAttribute("transform",`translate(${cx},${cy}) rotate(${Math.atan2(fy_-Math.cos(k*Math.PI)*120*Math.PI*0.6,fx_)*180/Math.PI})`);
    trails[i].setAttribute("d",`M0 0 Q${fx_/2} ${fy_/2-120} ${cx} ${cy}`); trails[i].style.opacity=k>0?0.6:0;
    const fk2=pop(t,S(12)+0.2+i*0.1,0.35); friends[i].g.style.opacity=fk2>0?1:0; friends[i].g.setAttribute("transform",`translate(${fx_},${fy_}) scale(${Math.max(0.001,fk2)})`);
    const bk2=pop(t,t0+0.5,0.35); friends[i].br.style.opacity=bk2>0?1:0; friends[i].br.setAttribute("transform",`scale(${Math.max(0.001,bk2)*(1+0.08*Math.sin(t*9+i))})`)});
  // title, answer banner, end card, ✅ sticker
  const ti=document.getElementById("title"); ti.style.opacity=t<0.15?0:t<S(1)-0.3?1:clamp(1-(t-S(1)+0.3)/0.3); ti.style.transform=`scale(${Math.max(0.01,back((t-0.15)/0.5))}) rotate(${Math.sin(t*2.5)*1.2}deg)`;
  const an=document.getElementById("ans");
  an.style.transform=`scale(${Math.max(0.01,back((t-tBan+0.05)/0.4))})`;
  an.style.opacity=t>tBan-0.05&&t<sh7?clamp(Math.min((t-tBan+0.05)/0.15,(sh7-t)/0.25)):0;
  const en=document.getElementById("end"); en.style.opacity=t>sh7?clamp((t-sh7)/0.3):0; en.style.transform=`translateY(${(1-out((t-sh7)/0.5))*40}px)`;
  const ec=document.getElementById("endC"); ec.style.opacity=t>tTick-0.1?1:0; ec.style.display=t>tTick-0.1?"inline-block":"none"; ec.style.transform=`scale(${Math.max(0.01,back((t-tTick+0.1)/0.35))})`;
  const ef=document.getElementById("endF"); ef.style.opacity=t>tFol-0.1?1:0; ef.style.display=t>tFol-0.1?"block":"none"; ef.style.transform=`scale(${Math.max(0.01,back((t-tFol+0.1)/0.4))*(1+(t>tFol+0.5?0.03*Math.sin(t*6):0))})`;
  const tc=document.getElementById("tick"), tck=back((t-tTick)/0.4); tc.style.opacity=t>tTick&&shot===7?1:0;
  tc.style.transform=`scale(${Math.max(0.01,lerp(2.2,1,clamp((t-tTick)/0.25)))*Math.max(0.01,tck)}) rotate(${lerp(-30,12,clamp((t-tTick)/0.3))+Math.sin(t*3)*3}deg)`;
  // subtitles
  const sub=document.getElementById("sub"), L=curLine(t);
  if(L){sub.style.opacity=1; sub.innerHTML=`<span class="who" style="background:${COLORS[L.who]}">${NAMES[L.who]}</span><br>${L.text.replace(/…/g,"...")}`} else sub.style.opacity=0;
};
