    hand.setAttribute("transform",`rotate(${(sec+tick)*72})`);
    document.getElementById("arc").setAttribute("stroke-dasharray",`${389.6*(1-cdk/TL.countdown)} 389.6`);
    document.getElementById("clockBody").setAttribute("transform",`rotate(${Math.exp(-fr*7)*Math.sin(fr*60)*9}) scale(${1+Math.exp(-fr*8)*0.08})`);
    const n=Math.max(1,5-sec); dig.textContent=n; dig.style.opacity=fr<0.82?1:clamp(1-(fr-0.82)/0.18);
    dig.style.transform=`scale(${lerp(1.18,1,out(fr/0.22))})`; dig.style.color=n<=2?"#FF5252":"#F5B700";
  } else dig.style.opacity=0;
  vigR.style.opacity=shot===6?clamp(cdk/1.5)*0.7:0;
  streaks.forEach((ln,i)=>{const on=t>tCorr&&t<tCorr+0.4; const a=i/14*Math.PI*2, r0=260+((t*900+i*37)%300);
    ln.setAttribute("x1",540+Math.cos(a)*r0);ln.setAttribute("y1",860+Math.sin(a)*r0);ln.setAttribute("x2",540+Math.cos(a)*(r0+180));ln.setAttribute("y2",860+Math.sin(a)*(r0+180));ln.style.opacity=on?0.75:0});
  conf.forEach((c,i)=>{const t0=tCorr+0.05, k=t-t0; const on=k>0&&k<3.2; const x0=(i*97)%1080, vx=((i*53)%11-5)*14;
    c.setAttribute("x",x0+vx*k+Math.sin(k*4+i)*30); c.setAttribute("y",-60+k*(420+(i%7)*60)-(i%5)*40); c.setAttribute("transform",`rotate(${k*200+i*30} ${x0+vx*k} ${-60+k*(420+(i%7)*60)})`); c.style.opacity=on?Math.min(1,(3.2-k)/0.6):0});
  document.getElementById("flash").style.opacity=(t>CD1&&t<CD1+0.25?0.7*(1-(t-CD1)/0.25):0)+(t>tCorr&&t<tCorr+0.15?0.5*(1-(t-tCorr)/0.15):0);
  // title, hold tag, follow buttons, answer banner, sticker, share, end card
  const ti=document.getElementById("title"); ti.style.opacity=t<0.15?0:t<tWatch-0.45?1:clamp(1-(t-tWatch+0.45)/0.3); ti.style.transform=`scale(${Math.max(0.01,back((t-0.15)/0.5))}) rotate(${Math.sin(t*2.5)*1.2}deg)`;
  const ho=document.getElementById("hold"); ho.style.opacity=fade(t,tWatch-0.1,S(2)+0.6,0.2); ho.style.transform=`scale(${Math.max(0.01,back((t-tWatch+0.1)/0.4))*(1+0.03*Math.sin(t*7))}) rotate(${-2+Math.sin(t*3)*1.5}deg)`;
  const bt=document.getElementById("btns"); bt.style.opacity=fade(t,S(7)-0.2,T4+0.1,0.2); bt.style.transform=`scale(${Math.max(0.01,back((t-S(7)+0.2)/0.4))})`;
  const bF=document.getElementById("bF"), bS=document.getElementById("bS"), tap=document.getElementById("tap");
  const tapF=t>tFol&&t<tFol+0.25, tapS=t>tSub&&t<tSub+0.25;
  bF.textContent=t>tFol+0.12?"✓ FOLLOWING":"➕ FOLLOW"; bF.style.transform=`scale(${tapF?0.9:1})`;
  bS.textContent=t>tSub+0.12?"🔔 SUBSCRIBED":"🔔 SUBSCRIBE"; bS.style.background=t>tSub+0.12?"#616161":"#E53935"; bS.style.transform=`scale(${tapS?0.9:1})`;
  // the tap hand: hovers to FOLLOW, taps, slides to SUBSCRIBE, taps (button centres measured from the DOM)
  const rF=bF.getBoundingClientRect(), rS=bS.getBoundingClientRect();
  const tgt=t<(tFol+tSub)/2?rF:rS, prevT=t<(tFol+tSub)/2?tFol:tSub;
  const press=(t>tFol-0.15&&t<tFol+0.2)||(t>tSub-0.15&&t<tSub+0.2);
  const hx_=lerp(rF.left+rF.width/2,rS.left+rS.width/2,ease((t-tFol-0.3)/0.4)), hy_=rF.top+rF.height*0.7+(press?0:30)+Math.sin(t*6)*6;
  tap.style.opacity=bt.style.opacity>0.5&&t>S(7)+0.2?1:0; tap.style.transform=`translate(${hx_-45}px,${hy_}px) scale(${press?0.9:1})`;
  const an=document.getElementById("ans"); an.style.opacity=fade(t,tCorr-0.05,T8,0.15); an.style.transform=`scale(${Math.max(0.01,back((t-tCorr+0.05)/0.4))})`;
  const sk=document.getElementById("stk"); sk.style.opacity=fade(t,tTick-0.1,T10+0.2,0.1); sk.style.transform=`scale(${Math.max(0.01,lerp(2.2,1,out((t-tTick+0.1)/0.2)))}) rotate(${12+Math.sin(t*3)*2}deg)`;
  const sh=document.getElementById("shr"); const shOn=fade(t,tShare-0.3,tFollow-0.1,0.2); sh.style.opacity=shOn; sh.style.transform=`scale(${Math.max(0.01,back((t-tShare+0.3)/0.4))})`;
  const ak2=clamp((t-tShare-0.2)/0.6); const al=shareArrow.getTotalLength(); shareArrow.setAttribute("stroke-dasharray",al); shareArrow.setAttribute("stroke-dashoffset",al*(1-ak2));
  shareArrow.style.opacity=shOn*(t>tShare+0.2?1:0); const pt=shareArrow.getPointAtLength(al*Math.max(0.01,ak2)), pt0=shareArrow.getPointAtLength(Math.max(0,al*ak2-5));
  shareHead.setAttribute("transform",`translate(${pt.x},${pt.y}) rotate(${Math.atan2(pt.y-pt0.y,pt.x-pt0.x)*180/Math.PI})`); shareHead.style.opacity=ak2>0.05?shareArrow.style.opacity:0;
  friendE.style.opacity=shOn*(t>tAsk?1:0); friendE.setAttribute("transform",`translate(850 430) scale(${Math.max(.001,back((t-tAsk)/0.4))}) translate(-850 -430)`);
  if(shOn>0){const r=document.getElementById("bSh").getBoundingClientRect(); const pr=t>tShare-0.1&&t<tShare+0.2; tap.style.opacity=t>tShare-0.4?1:0; tap.style.transform=`translate(${r.left+r.width/2-45}px,${r.top+r.height*0.7+(pr?0:30)}px)`}
  const en=document.getElementById("end"); en.style.opacity=t>tFollow-0.1?clamp((t-tFollow+0.1)/0.3):0; en.style.transform=`translateY(${(1-out((t-tFollow+0.1)/0.5))*40}px)`;
  const ec=document.getElementById("endC"); ec.style.opacity=1; ec.style.display="inline-block"; ec.style.transform=`scale(${Math.max(0.01,back((t-tFollow)/0.35))})`;
  const ef=document.getElementById("endF"); ef.style.opacity=t>tFollow+0.1?1:0; ef.style.transform=`scale(${Math.max(0.01,back((t-tFollow-0.1)/0.4))*(1+(t>tRepu?0.03*Math.sin(t*6):0))})`;
  // subtitles
  const sub=document.getElementById("sub"), L=curLine(t);
  if(L){sub.style.opacity=1; sub.innerHTML=`<span class="who" style="background:${COLORS[L.who]}">${NAMES[L.who]}</span><br>${L.text.replace(/…/g,"...")}`} else sub.style.opacity=0;
};
</script>
