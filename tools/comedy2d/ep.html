  function draw(){

[-36,36].forEach(x=>{el("ellipse",{cx:x,cy:-405,rx:21,ry:25,fill:"#fff"},bFace);el("circle",{cx:x,cy:-402,r:11,fill:"#111"},bFace)});

let TL;

const S=i=>TL.lines[i].start, E=i=>TL.lines[i].start+TL.lines[i].dur;

window.render=function(t){

  const lb=slow?out((t-slowA)/0.5)*150:0; document.getElementById("barT").style.height=lb+"px";document.getElementById("barB").style.height=lb+"px";
  document.getElementById("slow").style.opacity=slow?1:(t>impact+0.1&&t<impact+0.9?1:0);
  lines.forEach((ln,i)=>{const on=(t>drag&&t<drag+1.6)||(t>fight&&t<impact);const y=500+i*70;ln.setAttribute("x1",on?(i%2?700:900):0);ln.setAttribute("y1",y);ln.setAttribute("x2",on?(i%2?1000:1080):0);ln.setAttribute("y2",y);ln.style.opacity=on?0.7:0});
  const boom=document.getElementById("boom"); const bk=clamp((t-impact)/0.15); boom.style.opacity=(t>impact&&t<impact+0.9)?1:0; boom.style.transform=`scale(${0.4+0.8*out(bk)}) rotate(-6deg)`;
  const ti=document.getElementById("title"); ti.style.opacity=t<0.3?0:t<3.8?1:clamp(1-(t-3.8)/0.4); ti.style.transform=`scale(${0.7+0.3*out(t/0.5)})`;
  const en=document.getElementById("end"); en.style.opacity=clamp((t-endT-0.2)/0.4); en.style.transform=`translateY(${(1-out((t-endT-0.2)/0.5))*40}px)`;
  // narrator badge + subtitles
  bMouth.setAttribute("ry",3+22*talkOf("gopi",t)); badge.style.opacity=curLine(t)&&curLine(t).who==="gopi"?1:0.35;
  const sub=document.getElementById("sub"), L=curLine(t);
  if(L){sub.style.opacity=1; sub.innerHTML=`<span class="who" style="background:${COLORS[L.who]}">${NAMES[L.who]}</span><br>${L.text}`} else sub.style.opacity=0;
};
</script>
