  for(const k in C){const s=C[k].st;Object.assign(s,{talk:talkOf(k,t),blink:((t*0.7+k.length)%3.1)<0.12?1:0,hop:0,rot:0,brow:"n",look:0,lookY:0,

  qmark.style.opacity=qk>0?1:0; qmark.setAttribute("transform",`translate(${BW/2},${BH/2}) scale(${Math.max(0.001,qk)*(1+0.04*Math.sin(t*8))}) translate(${-BW/2},${-BH/2})`);
  // father (elder) + his rule
  const dk=pop(t,S(2)-0.05); dad.style.opacity=dk>0?1:0;
  dad.setAttribute("transform",`translate(553,${LA}) scale(${Math.max(0.001,dk)})`);

  if(stern){dadArm.setAttribute("x2",-34);dadArm.setAttribute("y2",-128+Math.sin(t*10)*5)} else {dadArm.setAttribute("x2",-24);dadArm.setAttribute("y2",-58)}

  }else{

  // ---------------- shot 1: hook ----------------
  if(shot===1){
    gp.look=0; gp.lookY=0;
    gp.hop=t<1.0?Math.max(0,Math.sin(clamp((t-0.55)/0.35)*Math.PI))*40:0;
    C.gopi.aimLocal("L",-95,-165,112);
    if(t<1.1){const w=Math.sin(t*16); C.gopi.aimLocal("R",205+w*35,-455,130); gp.item="palm"; gp.brow="u"; gp.jaw=t>0.55&&t<0.85?0.4:0}  // "Hey!" wave
    else if(t<2.0){C.gopi.aimLocal("R",190,-310,130); gp.item="palm"; gp.brow="a"; gp.smile=0}      // "ఆగండి" palm out
    else if(t<S(1)){C.gopi.aimLocal("R",175,-340,128); gp.item="point"; gp.brow="q"; gp.look=0.3}  // "the slow one wins?!"
    else {C.gopi.aimLocal("R",30,-360,100); gp.item="point"; gp.itemRot=-40; gp.brow="q"; gp.look=0.5; gp.lookY=-0.2; C.gopi.aimLocal("L",-95,-165,112)}  // secretive: finger by mouth
  }
  // ---------------- shot 2: the story on the board ----------------
  if(shot===2){
    gp.look=1; gp.lookY=-0.6;
    if(t<tKid) {pointB(553,LA-110); C.gopi.aimLocal("L",-120,-210)}
    else if(t<S(3)) {pointB(200,(LA+LB)/2-40); C.gopi.aimLocal("L",-120,-210)}
    else if(t<s4) {pointB(tFlag<t?FIN-30:553,tFlag<t?160:LA-110); gp.brow="a"; gp.smile=0; gp.hmm=1; C.gopi.aimLocal("L",-60,-420,100); gp.headRot+=Math.sin(t*6)*3}  // stern elder
    else if(t<S(5)) {pointB(lerp(40,330,snk),400); gp.brow="s"; gp.headRot=Math.sin(t*1.5)*6; C.gopi.aimLocal("L",-140+Math.sin(t*2)*20,-230)}  // slooow
    else if(t<S(6)) {pointB(300,LA-90); C.gopi.aimLocal("L",-30,-350,90); gp.brow="q"; gp.lookY=-0.3}   // hand by the mouth: whisper
    else {gp.look=0.6; gp.lookY=-0.2; gp.item=""; gp.brow="u"; gp.grin=1; const w=Math.sin(t*20);
      C.gopi.aimLocal("R",120+w*40,-250,110); C.gopi.aimLocal("L",-120-w*40,-250,110); gp.walk=t*18; gp.hop=Math.abs(Math.sin(t*10))*14}   // running!
  }
  // ---------------- shot 3: follow aside ----------------
  if(shot===3){
    gp.look=0; gp.lookY=-0.4; gp.brow="u";
    C.gopi.aimLocal("R",130,-540,130); gp.item="point"; gp.itemRot=-90; C.gopi.aimLocal("L",-95,-165,112);
    gp.hop=Math.max(0,Math.sin(clamp((t-tTapF)/0.3)*Math.PI))*18+Math.max(0,Math.sin(clamp((t-tTapS)/0.3)*Math.PI))*18;
  }
  // ---------------- Pinky ----------------
  Object.assign(pi,{x:PX,y:PY,s:PS,flip:-1,look:1,lookY:-0.3});
  const pk=back((t-sh4)/0.42); pi.vis=t>sh4?1:0; pi.s=PS*Math.max(0.001,pk); pi.rot=t<sh4+0.5?(1-clamp((t-sh4)/0.5))*-20:0;
  pi.headRot=Math.sin(t*1.7+1)*3;
  const a9=S(9), b9=segsOf(9).length?segsOf(9)[0][1]:S(9)+0.6;
  if(shot===4){
    if(t<S(8)){pi.brow="u"; pi.jaw=0.3; C.pinky.aimLocal("R",150,-460,120); C.pinky.aimLocal("L",-120,-200)}
    else if(t<a9){pi.brow="q"; pi.look=1; pi.lookY=-0.6; C.pinky.aimLocal("R",30,-345,105); C.pinky.aimLocal("L",-90,-200)}

    if(t<a9){gp.look=1; gp.lookY=-0.3; C.gopi.aimLocal("L",-120,-210); C.gopi.aimLocal("R",100,-200); gp.itemRot=gp.armR+20}
    else if(t<b9+0.2){const w=Math.sin(t*22); C.gopi.aimLocal("R",95+w*30,-470,120); gp.item=""; gp.headRot=w*7; gp.brow="a"; gp.grin=1; C.gopi.aimLocal("L",-120,-210)}  // "ఉహూ!" finger wag
    else {gp.look=0; gp.lookY=0.6; C.gopi.aimLocal("R",150,-120,125); gp.item="point"; gp.itemRot=60; gp.brow="u"; C.gopi.aimLocal("L",-95,-165,112)}   // points down: comment!
  }
  // ---------------- shot 5: countdown ----------------
  const cdk=t-CD0, sec=Math.floor(cdk), fr=cdk-sec;
  if(shot===5){
    gp.look=1; gp.lookY=0; gp.smile=1; gp.brow="q"; C.gopi.aimLocal("L",45,-232,96); C.gopi.aimLocal("R",-45,-214,96);

  }
