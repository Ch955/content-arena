const smear=el("path",{d:"M-30 -46 q20 -8 40 0 q10 4 -4 6 q-20 2 -36 -6z",fill:"#C8861E",opacity:0},bowl);
const jamun=el("g",{},bowl);el("circle",{cx:0,cy:-66,r:36,fill:"#5D2A12"},jamun);el("circle",{cx:0,cy:-66,r:36,fill:"#8B3A16",opacity:.6},jamun);
el("ellipse",{cx:-12,cy:-80,rx:12,ry:8,fill:"#fff",opacity:.8},jamun);el("circle",{cx:14,cy:-56,r:5,fill:"#fff",opacity:.5},jamun);
const shine=el("g",{},bowl);[[-40,-100],[45,-110],[0,-125]].forEach(([x,y])=>el("text",{x,y,"font-size":34,"text-anchor":"middle"},shine).textContent="✨");
// Pinky's waterfall tears, sweat/sob drops, notes
const drops=[...Array(26)].map(()=>el("ellipse",{rx:9,ry:14,fill:"#4FC3F7",opacity:0},cam));
const notes=[...Array(4)].map(()=>{const n=el("text",{"font-size":56,"text-anchor":"middle",fill:"#3E2723",opacity:0},cam);n.textContent="♪";return n});
const speed=[...Array(9)].map(()=>el("line",{stroke:"#fff","stroke-width":8,"stroke-linecap":"round",opacity:0},cam));
const hearts=[...Array(5)].map(()=>{const n=el("text",{"font-size":46,"text-anchor":"middle",opacity:0},cam);n.textContent="💧";return n});
const vigR=el("rect",{x:0,y:0,width:1080,height:1920,fill:"url(#vig)",opacity:0});
const lines=[...Array(16)].map(()=>el("line",{stroke:"#fff","stroke-width":6,opacity:0},svg));

// ---------- timeline ----------
const COLORS={gopi:"#F5B700",chinna:"#64B5F6",pandu:"#81C784",pinky:"#F48FB1",amma:"#CE93D8"};
const NAMES={gopi:"GOPI",chinna:"CHINNA",pandu:"PANDU",pinky:"PINKY",amma:"LAKSHMI AMMA"};
let TL;
function talkOf(who,t){for(const l of TL.lines){if(l.who!==who)continue;const f=Math.floor((t-l.start)*TL.fps);if(f>=0&&f<l.env.length)return l.env[f]}return 0}
function curLine(t){return TL.lines.find(l=>t>=l.start-0.1&&t<l.start+l.dur+0.25)}
const S=i=>TL.lines[i].start, E=i=>TL.lines[i].start+TL.lines[i].dur;
const MAT_Y=1360, CX=330, AX=720, BOWL_C=455, BOWL_A=595, BOWL_Y=1372;

window.render=function(t){
  const gp=C.gopi.st,ch=C.chinna.st,pa=C.pandu.st,pi=C.pinky.st,am=C.amma.st;
  // shot boundaries
  const sh2=S(2)-0.55, sh3=S(4)-0.3, sh4=E(5)+0.45, freeze=E(6)+0.55, sh5=S(8)-0.35, pan=E(8)+0.05, sh6=S(10)-0.35;
  const zip=E(6)+0.05;              // Pandu's blur-steal while both close their eyes
  const shot=t<sh2?1:t<sh3?2:t<sh4?3:t<sh5?4:t<sh6?5:6;
  // defaults
  for(const k in C){const s=C[k].st;Object.assign(s,{talk:talkOf(k,t),blink:((t*0.7+k.length)%3.1)<0.12?1:0,hop:0,rot:0,brow:"n",cry:0,look:0,lookY:0,
    walk:0,sit:0,puff:0,smile:0,grin:0,shut:0,jaw:0,item:"",itemRot:0,violin:0,pop:0,armL:200,armR:160,lenL:115,lenR:115,flip:1})}
  // ---- the mat family (base pose) ----
  Object.assign(ch,{x:CX,y:MAT_Y,s:0.9,sit:1,look:1,lookY:0.6,capeWind:4});
  Object.assign(am,{x:AX,y:MAT_Y,s:1.0,sit:1,flip:-1,look:-1,lookY:0.6,item:"ladle"});
  Object.assign(pi,{x:525,y:1300,s:0.72,sit:1,look:0,lookY:1,item:"lolli",armR:150,armL:200});
  // bowl position
  let bx=BOWL_C, bj=1;   // bj: jamun present
  if(shot===2){ if(t<S(3)-0.2) bx=lerp(BOWL_C,BOWL_A,ease((t-S(2)-0.2)/(E(2)-S(2)))); else bx=lerp(BOWL_A,BOWL_C,ease((t-S(3)-0.3)/(E(3)-S(3)))); }
  if(shot===3){ const T0=sh3,k=t-T0; const ph=2*Math.PI*(0.35*k+0.09*k*k); bx=(BOWL_C+BOWL_A)/2-((BOWL_A-BOWL_C)/2)*Math.cos(ph); }
  if(shot>=4){ bx=(BOWL_C+BOWL_A)/2; if(t>zip+0.12) bj=0; }
  if(shot===1) bx=(BOWL_C+BOWL_A)/2;
  bowl.setAttribute("transform",`translate(${bx},${BOWL_Y})`); jamun.style.opacity=bj; smear.style.opacity=1-bj; shine.style.opacity=bj?(0.5+0.5*Math.sin(t*6)):0;
  // family staring at the jamun, wobbling teary eyes
  const lookAt=(c,x)=>{c.look=clamp((x-c.x)/(c.s*c.flip)/90,-1,1)};
  lookAt(ch,bx); lookAt(am,bx); lookAt(pi,bx);
  if(shot<=3){ch.brow="s";am.brow="s";pi.brow="s"; ch.cry=t*1.5; am.cry=t*1.5+0.3}
  // hands to the bowl
  const rimL=bx-70, rimR=bx+70, rimY=BOWL_Y-40;
  if(shot===2){
    C.chinna.aimLocal("L",-5,-250);          // hand on heart
    if(t<S(3)-0.2) C.chinna.aim("R",rimL,rimY); else C.chinna.aim("R",ch.x+120,ch.y-30);
    if(t>S(3)-0.6) C.amma.aim("R",rimR,rimY); else C.amma.aimLocal("R",10,-250);   // ladle pressed to chest, then slides it back
  }
  if(shot===3){
    const nearC=bx<(BOWL_C+BOWL_A)/2;
    C.chinna.aim("R",nearC?rimL:Math.min(rimL,ch.x+150),rimY); C.amma.aim("R",!nearC?rimR:Math.max(rimR,am.x-160),rimY);
    if(t>S(4)) C.chinna.aimLocal("L",-36,-405);   // dabs his eyes
    ch.shut=t>S(4)+0.2&&t<E(4)?1:0; ch.talk=Math.max(ch.talk,0);
  }
  if(shot===4){
    const reach=ease((t-(E(6)-0.45))/0.6);
    ch.cry=0; am.cry=0;
    if(t<freeze){ch.shut=1; am.shut=1; ch.smile=1; am.smile=1; ch.brow="n"; am.brow="n"; }
    C.chinna.aim("R",lerp(ch.x+110,bx-20,reach),lerp(ch.y-40,BOWL_Y-55,reach)); C.amma.aim("R",lerp(am.x-120,bx+20,reach),lerp(am.y-40,BOWL_Y-55,reach));
    if(t>=freeze){ch.jaw=t<S(7)?clamp((t-freeze)/0.2):Math.max(0.6,ch.talk); ch.brow="u"; am.brow="u"; am.jaw=0.5; ch.lookY=1; am.lookY=1; pi.brow="u"; pi.jaw=0.4}
  }
  // Pinky: waterfall of tears in shot 3, points in shot 5
  if(shot===3){pi.cry=t*2; pi.shut=0; pi.brow="s"; pi.jaw=0.5+0.3*Math.sin(t*12)}
  if(shot===5){pi.brow="u"; pi.flip=-1; pi.look=-1; pi.lookY=0; pi.armR=200; if(t>S(8)-0.2) C.pinky.aim("L",pi.x+300,pi.y-330,125)}
  // Gopi
  Object.assign(gp,{x:200,y:1330,s:0.86,flip:-1,look:-1,item:"bow",violin:1});
  if(shot===1||shot===6){Object.assign(gp,{x:shot===1?960:930,y:1700,s:1.15,flip:1,look:0,lookY:0,item:"mic",violin:0}); C.gopi.aimLocal("R",95,-430,118);}
  let bowing=0;
  if(shot===2&&t>S(3)-0.3) bowing=0.5; if(shot===3) bowing=1+clamp((t-S(5))/1.5); if(shot===4&&t<freeze) bowing=0.6;
  if(shot>=2&&shot<=4){
    C.gopi.aimLocal("L",-150,-330);   // holds the violin neck
    const b=Math.sin(t*(bowing>0?6+8*bowing:0)); gp.itemRot=-28+b*6;
    C.gopi.aimLocal("R",-10+b*55*Math.min(1,bowing),-205+b*10); gp.shut=bowing>0?1:0; gp.hop=bowing>1?Math.abs(Math.sin(t*14))*8:0;
    if(shot===4&&t>=freeze){gp.pop=clamp((t-freeze)/0.15); gp.shut=0; gp.brow="u"; gp.jaw=0.5; gp.lookY=1; gp.look=1}
  }
  if(shot===1){ C.gopi.aimLocal("L",-150,-470,125); gp.brow=t>S(1)?"a":"n"; gp.smile=1;    // palm out: "stop!"
    if(t>S(1)){gp.look=-1; C.gopi.aimLocal("R",80,-380,118)} }
  // Pandu
  Object.assign(pa,{x:-500,y:1300,s:0.82,flip:-1,look:-1,brow:"a",grin:1});
  if(shot===2){const k=0.5+0.5*Math.sin((t-sh2)*1.3); pa.x=985-55*k; pa.y=1290; pa.look=-1; pa.lookY=1}
  if(shot===3){const k=ease((t-sh3)/(sh4-sh3)); pa.x=lerp(1000,880,k); pa.y=1300; pa.hop=-40; pa.walk=t*5; pa.rot=-6; pa.look=-1; pa.lookY=1; pa.armL=230; pa.armR=130}
  const onSwing=t>zip+0.4;
  if(shot===4&&!onSwing&&t>zip-0.6){
    if(t<zip){pa.x=880; pa.y=1300; pa.hop=-40; pa.look=-1}
    else {const k=clamp((t-zip)/0.4); pa.x=k<.45?lerp(880,bx+40,k/.45):lerp(bx+40,1400,(k-.45)/.55); pa.y=lerp(1300,BOWL_Y+40,Math.sin(k*Math.PI)); pa.rot=-12; pa.walk=t*30}
  }
  // swing
  const sa=onSwing? Math.sin(t*2.4)*(shot===6?10:14):0, pivot=[1190,955], ropeL=300;
  const seatX=pivot[0]+Math.sin(sa*Math.PI/180)*ropeL, seatY=pivot[1]+Math.cos(sa*Math.PI/180)*ropeL;
  ropeA.setAttribute("x1",pivot[0]-60);ropeA.setAttribute("y1",pivot[1]);ropeA.setAttribute("x2",seatX-60);ropeA.setAttribute("y2",seatY);
  ropeB.setAttribute("x1",pivot[0]+60);ropeB.setAttribute("y1",pivot[1]);ropeB.setAttribute("x2",seatX+60);ropeB.setAttribute("y2",seatY);
  seat.setAttribute("x",seatX-75);seat.setAttribute("y",seatY);
  if(onSwing){
    Object.assign(pa,{x:seatX,y:seatY+12,sit:1,flip:1,look:-1,puff:1,grin:0,brow:"n",rot:sa*0.6});
    if(pa.talk<0.1) pa.smile=1;
    const lick=Math.sin(t*5); C.pandu.aimLocal("L",-20,-350+lick*15); // licks fingers
    C.pandu.aimLocal("R",-20,-220);  // pats tummy
    if(shot===6){C.pandu.aimLocal("R",-10+Math.sin(t*8)*20,-205); C.pandu.aimLocal("L",-60,-130)}
  }
  // Pandu: hidden behind the trunk until the steal, then in front of everyone
  if(t<zip) panduSlot.appendChild(C.pandu.g); else cam.appendChild(C.pandu.g);
  // shot 5/6 reactions
  if(shot===5){lookAt(ch,1190); lookAt(am,1190); ch.brow="u"; am.brow="u"; ch.jaw=0.4; am.lookY=0; ch.lookY=0;
    am.smile=t>E(9)?1:0;}
  if(shot===6){
    const hug=out((t-sh6-0.3)/0.8);
    ch.x=lerp(CX,450,hug); am.x=lerp(AX,600,hug); ch.cry=t*2; am.cry=t*2+.3; ch.shut=1; am.shut=1; ch.brow="s"; am.brow="s"; ch.jaw=0.5+0.3*Math.sin(t*9); am.jaw=0.4+0.3*Math.sin(t*8+1);
    C.chinna.aim("R",am.x-40,am.y-140*0.9-60); C.amma.aim("R",ch.x+40,ch.y-170); C.chinna.aim("L",ch.x+40,ch.y-200);
    const tod=out((t-S(11)+0.6)/1.0);  // Pinky toddles up, offers her lollipop
    Object.assign(pi,{x:lerp(525,300,tod),y:lerp(1300,1350,tod),sit:tod>0?0:1,s:0.72,flip:-1,walk:tod>0&&tod<1?t*10:0,look:1,brow:"n",smile:1});
    if(tod>0.5) C.pinky.aim("R",ch.x-20,ch.y-170);
    gp.smile=1; gp.look=0;
    if(t>S(11)){C.gopi.aimLocal("R",120,-330,110); gp.item=""; gp.hop=Math.abs(Math.sin(t*7))*10}   // thumbs-up
  }
  for(const k in C)C[k].draw();
  // ---- camera ----
  let z=1.1,fx=640,fy=1200;
  if(shot===2){z=1.2; fx=lerp(570,585,(t-sh2)/5); fy=1150}
  if(shot===3){z=lerp(1.18,1.28,(t-sh3)/(sh4-sh3)); fx=595; fy=1160}
  if(shot===4){z=1.75; fx=525; fy=1170; if(t>=freeze-0.05&&t<S(7)-0.05){z=lerp(2.2,2.7,(t-freeze)/0.6); fx=bx; fy=BOWL_Y-80}}
  if(shot===5){
    if(t<pan){z=2.0; fx=480; fy=1110}
    else {const k=ease((t-pan)/0.55); z=lerp(2.0,1.75,Math.sin(k*Math.PI)*0.5+k*0.5)*1; fx=lerp(480,1190,k); fy=lerp(1110,1080,k);
      if(t>E(9)+0.1){const k2=ease((t-E(9)-0.1)/0.5); z=lerp(1.75,0.96,k2); fx=lerp(1190,770,k2); fy=lerp(1080,1230,k2)}}
  }
  if(shot===6){z=0.96; fx=lerp(770,760,(t-sh6)/6); fy=1230}
  let sx=0,sy=0; if(shot===4&&t>freeze&&t<freeze+0.3){const a=(1-(t-freeze)/0.3)*14;sx=Math.sin(t*90)*a;sy=Math.cos(t*77)*a}
  cam.setAttribute("transform",`translate(${540+sx},${1000+sy}) scale(${z}) translate(${-fx},${-fy})`);
  // ---- ambience ----
  clouds.forEach((c,i)=>c.g.setAttribute("transform",`translate(${(c.x+t*(8+i*4))%1700-200},${c.y})`));
  // Pinky's waterfall
  const pEye=[pi.x-36*pi.s, pi.x+36*pi.s], pEyeY=pi.y+(115-405)*pi.s;
  drops.forEach((d,i)=>{const side=i%2?1:-1, life=((t*1.4+i*0.083)%1); const on=shot===3&&t>sh3+0.3 || shot===6&&false;
    d.setAttribute("cx",pEye[i%2]+side*life*130); d.setAttribute("cy",pEyeY+life*life*260-life*60); d.style.opacity=on?(1-life*0.6):0});
  // violin notes
  notes.forEach((n,i)=>{const life=((t*0.8+i*0.25)%1); const on=bowing>0&&!(shot===4&&t>=freeze);
    n.setAttribute("x",gp.x+60+life*120+Math.sin(t*3+i)*20); n.setAttribute("y",gp.y-420-life*240); n.style.opacity=on?(1-life):0});
  // sob drops in the CTA hug
  hearts.forEach((h,i)=>{const life=((t*0.9+i*0.2)%1); h.setAttribute("x",(ch.x+am.x)/2+(i-2)*45); h.setAttribute("y",ch.y-330-life*120); h.style.opacity=shot===6&&t>sh6+0.8?(1-life)*0.9:0});
  // zip speed lines behind Pandu
  speed.forEach((ln,i)=>{const on=shot===4&&t>zip&&t<zip+0.45; const y=pa.y-60-i*45; ln.setAttribute("x1",pa.x-40-i%3*30);ln.setAttribute("y1",y);ln.setAttribute("x2",pa.x-260-i%3*40);ln.setAttribute("y2",y);ln.style.opacity=on?0.85:0});
  // whip-pan streaks
  lines.forEach((ln,i)=>{const on=shot===5&&t>pan&&t<pan+0.5; const y=420+i*80; ln.setAttribute("x1",on?(i%2?150:350):0);ln.setAttribute("y1",y);ln.setAttribute("x2",on?(i%2?900:1060):0);ln.setAttribute("y2",y);ln.style.opacity=on?0.6:0});
  // slow-motion drama in shot 3: letterbox + vignette
  const drama=shot===3; vigR.style.opacity=drama?0.9:(shot===4&&t>freeze&&t<freeze+0.3?0.5:0);
  const lb=drama?out((t-sh3)/0.5)*150:0; document.getElementById("barT").style.height=lb+"px";document.getElementById("barB").style.height=lb+"px";
  // sentiment meter (rises with Gopi's count)
  const me=document.getElementById("meter"); const mOn=t>sh3+0.2&&t<sh4;
  me.style.opacity=mOn?1:0;
  let pct=0; if(t>S(5)){const k=(t-S(5))/TL.lines[5].dur; pct=k<.35?lerp(10,35,k/.35):k<.55?50:k<.75?90:100} else if(t>sh3) pct=lerp(0,10,clamp((t-sh3)/2));
  document.getElementById("fill").style.width=pct+"%"; const pc=document.getElementById("pct"); pc.textContent=Math.round(pct)+"%";
  pc.style.transform=`scale(${pct>=100?1.15+0.08*Math.sin(t*30):1})`; pc.style.color=pct>=100?"#E63946":"#F5B700";
  document.getElementById("flash").style.opacity=shot===4&&t<sh4+0.15?0.8*(1-(t-sh4)/0.15):0;
  const ti=document.getElementById("title"); ti.style.opacity=t<0.3?0:t<3.8?1:clamp(1-(t-3.8)/0.4); ti.style.transform=`scale(${0.7+0.3*out(t/0.5)})`;
  const endT=S(11)-0.2, en=document.getElementById("end"); en.style.opacity=clamp((t-endT)/0.4); en.style.transform=`translateY(${(1-out((t-endT)/0.5))*40}px)`;
  // subtitles
  const sub=document.getElementById("sub"), L=curLine(t);
  if(L){sub.style.opacity=1; sub.innerHTML=`<span class="who" style="background:${COLORS[L.who]}">${NAMES[L.who]}</span><br>${L.text.replace(/…/g,"...")}`} else sub.style.opacity=0;
};
</script>
