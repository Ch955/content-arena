    if(t<a9b){C.gopi.aimLocal("R",175,-340,128); gp.item="point"; C.gopi.aimLocal("L",-95,-165,112); gp.brow="q"}           // points at you
    else if(t<a9c){C.gopi.aimLocal("R",150,-120,125); gp.item="point"; gp.itemRot=60; C.gopi.aimLocal("L",-95,-165,112); gp.brow="n"; gp.lookY=0.8}   // points down: comments
    else {const w=Math.sin(t*12); C.gopi.aimLocal("R",205+w*35,-455,130); gp.item="palm"; C.gopi.aimLocal("L",-95,-165,112); gp.hop=t>a9c+1.2?Math.abs(Math.sin(t*6))*12:0}   // waves
    pi.smile=1; pi.look=t<a9c?-1:0; pi.lookY=0; const w=Math.sin(t*11+1);
    C.pinky.aimLocal("R",90+w*35,-460,115); C.pinky.aimLocal("L",-60,-190); if(t>a9c) pi.hop=Math.abs(Math.sin(t*6+0.5))*16;
  }
  for(const k in C)C[k].draw();

  // ---------------- props in front of the cast ----------------
  const bk=t>S(3)-0.05&&t<CD0+0.1?back((t-S(3)+0.05)/0.35):0;
  bub.style.opacity=bk>0?clamp((CD0+0.1-t)/0.2):0;
  bub.setAttribute("transform",`translate(${PX-75},${PY-PS*520-150+Math.sin(t*3)*5}) scale(${Math.max(0.001,bk)})`);
  const xk=back((t-a4+0.05)/0.28); cross.style.opacity=t>a4-0.05?1:0; cross.setAttribute("transform",`scale(${Math.max(0.001,lerp(2.2,1,clamp((t-a4+0.05)/0.2)))*(xk>0?1:0)}) rotate(${(1-clamp((t-a4)/0.2))*-15})`);
  thought.style.opacity=shot===4?clamp(cdk/0.3)*clamp((TL.countdown-cdk)/0.2):0;
  thought.setAttribute("transform",`translate(${PX-70},${PY-PS*540}) scale(${0.95+0.08*Math.sin(t*6)})`);
  tq.setAttribute("transform",`rotate(${Math.sin(t*4)*10} -96 -140)`);
  exclaim.style.opacity=shot===5&&t<S(5)+0.9?1:0; exclaim.setAttribute("x",PX-120); exclaim.setAttribute("y",PY-PS*540-pi.hop); exclaim.setAttribute("transform",`rotate(-12 ${PX-120} ${PY-460})`);
  const clapOn=shot===5&&t>S(8)-0.15&&t<E(8)+0.3;
  sparks.forEach((s,i)=>{const life=((t*1.1+i/7)%1), a=i/7*Math.PI*2+t*0.6; const on=clapOn||(shot===6&&t>a9c);
    s.setAttribute("x",PX+Math.cos(a)*(140+life*80)); s.setAttribute("y",PY-260+Math.sin(a)*(140+life*80)-life*40); s.style.opacity=on?(1-life):0});
  clapFx.forEach((p,j)=>{const a=(-90+(j-1.5)*30)*Math.PI/180, hx_=PX, hy_=PY-PS*290-pi.hop; const c=Math.abs(Math.sin(t*15));
    p.setAttribute("d",`M${hx_+Math.cos(a)*60} ${hy_+Math.sin(a)*60} L${hx_+Math.cos(a)*95} ${hy_+Math.sin(a)*95}`); p.style.opacity=clapOn&&c<0.35?1:0});

  // ---------------- camera ----------------
  let z=1.1,fx=600,fy=1080;
  const fyFor=(z,wy,sy)=>wy-(sy-1000)/z;        // put world y `wy` at screen y `sy`
  if(shot===1){z=lerp(1.75,1.5,out(t/1.2))+0.02*Math.sin(t*2); fx=lerp(250,320,ease(t/3.5)); fy=fyFor(z,GY-GS*300,1080)}
  if(shot===2){const k=clamp((t-sh2)/0.5); const k2=(t-sh2)/(sh3-sh2);
    z=lerp(1.5,1.06,ease(k))+0.06*k2; fx=lerp(320,600,ease(k))+8*Math.sin(t*1.3); fy=lerp(fyFor(1.5,GY-GS*300,1080),fyFor(1.06,BY+BH/2,820),ease(k));
    if(t>a2c){const k3=out((t-a2c)/0.3); z+=0.1*k3; fy=fyFor(z,BY+BH/2,820)} else fy=k<1?fy:fyFor(z,BY+BH/2,820)}
  if(shot===3){
    if(t<a4-0.05){const k=ease((t-sh3)/0.45); z=lerp(1.12,1.2,k); fx=lerp(600,760,k); fy=fyFor(z,BY+BH/2+60,820)}
    else if(t<a4b){const k=out((t-a4+0.05)/0.3); z=lerp(1.2,1.0,k); fx=lerp(760,620,k); fy=fyFor(z,BY+BH/2+60,820)}
    else {const k=ease((t-a4b)/0.5); z=lerp(1.0,1.35,k)+0.03*(t-a4b); fx=lerp(620,330,k); fy=fyFor(z,GY-GS*300,lerp(780,1060,k))}
  }
  if(shot===4){const k=ease(cdk/0.45); const pulse=Math.exp(-fr*6)*0.025;
    z=lerp(1.4,1.0,k)+0.016*cdk+pulse; fx=lerp(330,630,k); fy=fyFor(z,BY+BH/2,lerp(1060,830,k))}
  if(shot===5){
    if(t<S(6)){const k=out((t-CD1)/0.35); z=lerp(0.95,1.12,k); fx=615; fy=fyFor(z,BY+BH/2,860)}
    else if(t<S(8)-0.25){const k=(t-S(6))/(S(8)-S(6)); z=lerp(1.12,1.3,k); fx=lerp(615,650,k); fy=fyFor(z,BY+FCY,840)}
    else {const k=ease((t-S(8)+0.25)/0.45); z=lerp(1.3,1.2,k); fx=lerp(650,800,k); fy=lerp(fyFor(1.3,BY+FCY,840),fyFor(1.2,PY-PS*260,1060),k)}
  }
  if(shot===6){const k=ease((t-sh6)/0.6); z=lerp(1.2,1.0,k)+0.012*(t-sh6); fx=lerp(800,620,k); fy=lerp(fyFor(1.2,PY-PS*260,1060),fyFor(1.0,BY+BH/2,900),k)}
  let sx=0,sy=0;
  const shake=(t0,d,a)=>{if(t>t0&&t<t0+d){const q=(1-(t-t0)/d)*a; sx+=Math.sin(t*90)*q; sy+=Math.cos(t*77)*q}};
  shake(a4,0.3,16); shake(CD1,0.35,18); shake(sh3+0.05,0.2,8);
  cam.setAttribute("transform",`translate(${540+sx},${1000+sy}) scale(${z}) translate(${-fx},${-fy})`);

  // ---------------- ambience ----------------
  clouds.forEach((c,i)=>c.g.setAttribute("transform",`translate(${(c.x+t*(8+i*4))%1700-200},${c.y})`));
  birds.forEach((b,i)=>{const x=((t*(40+i*12)+i*500)%1900)-400, y=380+i*60+Math.sin(t*2+i)*15; b.setAttribute("transform",`translate(${x},${y}) scale(${1+0.3*Math.sin(t*10+i)},1)`)});
  flags.forEach((f,i)=>f.e.setAttribute("transform",`translate(${f.x},${f.y}) rotate(${Math.sin(t*3+i*0.7)*7})`));
  // countdown overlay
  const clock=document.getElementById("clock"), dig=document.getElementById("digit"), th=document.getElementById("think");
  const cOn=shot===4; const cIn=clamp(cdk/0.3)*clamp((TL.countdown-cdk)/0.25);
  clock.style.opacity=cOn?cIn:0; th.style.opacity=cOn?cIn:0;
  if(cOn){const hand=document.getElementById("hand"), tick=Math.min(1,fr/0.08);
    hand.setAttribute("transform",`rotate(${(sec+tick)*72})`);
    document.getElementById("arc").setAttribute("stroke-dasharray",`${389.6*(1-cdk/TL.countdown)} 389.6`);
    document.getElementById("clockBody").setAttribute("transform",`rotate(${Math.exp(-fr*7)*Math.sin(fr*60)*9}) scale(${1+Math.exp(-fr*8)*0.08})`);
    const n=Math.max(1,5-sec); dig.textContent=n; dig.style.opacity=fr<0.82?1:clamp(1-(fr-0.82)/0.18);
    dig.style.transform=`scale(${lerp(1.6,1,out(fr/0.22))})`; dig.style.color=n<=2?"#FF5252":"#F5B700";
    th.style.transform=`translateY(${Math.sin(t*3)*5}px)`;
  } else dig.style.opacity=0;
  // tension vignette + streaks
  vigR.style.opacity=shot===4?clamp(cdk/1.5)*0.8:0;
  streaks.forEach((ln,i)=>{const on=shot===5&&t<CD1+0.4; const a=i/14*Math.PI*2, r0=260+((t*900+i*37)%300);
    ln.setAttribute("x1",540+Math.cos(a)*r0);ln.setAttribute("y1",760+Math.sin(a)*r0);ln.setAttribute("x2",540+Math.cos(a)*(r0+180));ln.setAttribute("y2",760+Math.sin(a)*(r0+180));ln.style.opacity=on?0.75:0});
  conf.forEach((c,i)=>{const t0=S(5)+0.05, k=t-t0; const on=k>0&&k<3.2; const x0=(i*97)%1080, vx=((i*53)%11-5)*14;
    c.setAttribute("x",x0+vx*k+Math.sin(k*4+i)*30); c.setAttribute("y",-60+k*(420+(i%7)*60)-(i%5)*40); c.setAttribute("transform",`rotate(${k*200+i*30} ${x0+vx*k} ${-60+k*(420+(i%7)*60)})`); c.style.opacity=on?Math.min(1,(3.2-k)/0.6):0});
  document.getElementById("flash").style.opacity=(t>CD1&&t<CD1+0.25?0.85*(1-(t-CD1)/0.25):0)+(t>S(5)&&t<S(5)+0.12?0.4*(1-(t-S(5))/0.12):0);
  // title, answer banner, end card
  const ti=document.getElementById("title"); ti.style.opacity=t<0.15?0:t<sh2-0.2?1:clamp(1-(t-sh2+0.2)/0.35); ti.style.transform=`scale(${Math.max(0.01,back((t-0.15)/0.5))}) rotate(${Math.sin(t*2.5)*1.2}deg)`;
  const an=document.getElementById("ans"), ak=t>S(5)-0.05&&t<sh6?1:0; an.style.opacity=ak?clamp(Math.min((t-S(5)+0.05)/0.15,(sh6-t)/0.25)):0;
  an.style.transform=`scale(${Math.max(0.01,back((t-S(5)+0.05)/0.4))})`;
  const en=document.getElementById("end"); en.style.opacity=t>sh6?clamp((t-sh6)/0.3):0; en.style.transform=`translateY(${(1-out((t-sh6)/0.5))*40}px)`;
  const ec=document.getElementById("endC"); ec.style.opacity=t>a9b-0.1?1:0; ec.style.display=t>a9b-0.1?"inline-block":"none"; ec.style.transform=`scale(${Math.max(0.01,back((t-a9b+0.1)/0.35))})`;
  const ef=document.getElementById("endF"); ef.style.opacity=t>a9c-0.1?1:0; ef.style.display=t>a9c-0.1?"block":"none"; ef.style.transform=`scale(${Math.max(0.01,back((t-a9c+0.1)/0.4))*(1+(t>a9c+0.5?0.03*Math.sin(t*6):0))})`;
  // subtitles
  const sub=document.getElementById("sub"), L=curLine(t);
  if(L){sub.style.opacity=1; sub.innerHTML=`<span class="who" style="background:${COLORS[L.who]}">${NAMES[L.who]}</span><br>${L.text.replace(/…/g,"...")}`} else sub.style.opacity=0;
};
</script>
