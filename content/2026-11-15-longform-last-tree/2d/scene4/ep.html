  [98.1, (t, C, op) => { const S = KIT.show("insert", { opacity: op, bright: .35 * rng(t, T.ring1, T.ring1 + .6), cam: { x: 960, y: 520 - 30 * rng(t, 98, 104), z: 1 + .08 * rng(t, 98, 104.5) + KIT.punch(t, T.ring1, .07) } });
    KIT.put(METER[C], S, { x: 960, y: 470, s: .95, glow: lerp(.8, 1.4, rng(t, T.ring1, T.ring1 + .6)), lit: [rng(t, T.ring1, T.ring1 + .45), 0, 0], pop: [T.ring1, null, null], hands: 1 });
    const [gx, gy] = KIT.toScreen(S, 960, 460); KIT.glow(.35 + .4 * rng(t, T.ring1, T.ring1 + .6), gx, gy, 600);
    KIT.motes(rng(t, T.ring1, T.ring1 + 1), 960, 520, 520); KIT.flash(.35 * Math.exp(-Math.max(0, t - T.courage) / .25) * (t > T.courage ? 1 : 0)); KIT.vignette(.7); }, .5],
];
function scene(t) {
  resetTints(); runShots(t, shots);
  KIT.title(pulse(t, .5, 3.9, .45), "మొదటి పరీక్ష", "ధైర్యం");
  KIT.fade(Math.max(1 - rng(t, 0, .6), rng(t, DUR - .8, DUR)));
}
