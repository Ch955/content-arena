<html><head><meta charset="utf-8">
<!-- Special-day reel "ఒక్క దీపం కోసం 50 లక్షల మంది" (Arunachalam Maha Deepam, 24 Nov 2026). 2D animated, FLAT skin in night
     colours shifting to dusk: the Arunachalam hill silhouette, crowds walking (from behind), buses + a train (no logos, no
     text), police caps, CCTV poles, the 14-km loop drawn around the hill, a medical tent (green cross) and banana-leaf
     plates, Pinky + Ammamma on the path (cast.md looks), big counters with Indian digit grouping, a side rail of 6 lamps
     (one per fact), the silent hilltop flame, the end card, and a hard cut back to frame 1 (loop). No deity faces, idols,
     temple interiors or ritual close-ups. Source strip 'Source: The Hindu, 23 Nov 2026' from L3 to the end card. -->
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Rama;src:url(fonts/Ramabhadra-Regular.ttf)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B1030}
svg{display:block}
#s{position:absolute;left:0;top:0}
.sub{position:absolute;left:30px;right:30px;bottom:170px;padding:16px 30px 20px;text-align:center;font-family:Rama,NotoTe;font-size:54px;line-height:1.35;color:#fff;

.who{display:inline-block;font-family:Anton;font-size:32px;letter-spacing:2px;padding:3px 16px;border-radius:10px;margin-bottom:8px;text-shadow:none;color:#10141E}

.tag{font-family:Anton;font-size:30px;letter-spacing:2px;background:#E8762B;color:#fff;padding:6px 16px;border-radius:8px;border:4px solid #10141E}

#cnt .row{display:inline-flex;align-items:center;gap:22px}

#cnt .lab{display:inline-block;margin-top:6px;font-family:Anton;font-size:52px;letter-spacing:3px;color:#fff;background:rgba(10,12,28,.82);border:5px solid #FFD54F;border-radius:16px;padding:2px 26px 6px}

#pinL{position:absolute;left:0;top:0;opacity:0;z-index:4;text-align:center;font-family:Anton;color:#10141E;background:#FFF4D6;border:6px solid #10141E;border-radius:18px;box-shadow:0 9px 0 #10141E;padding:6px 26px 8px;white-space:nowrap}

.btn.done{background:#6D6875 !important}
.hand{position:absolute;left:0;top:0;font-size:130px;opacity:0;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));z-index:7}
.ring{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:8px solid #fff;opacity:0;z-index:7}
/* caps card (L5) */
#caps{position:absolute;left:150px;top:640px;width:780px;height:330px;opacity:0;z-index:3;background:rgba(10,12,28,.62);border:5px solid rgba(255,213,79,.6);border-radius:30px}
/* comment bubbles (L10) */
.cb{position:absolute;opacity:0;background:#fff;border:5px solid #10141E;border-radius:26px;padding:8px 24px 10px;box-shadow:0 8px 0 rgba(16,20,30,.85);white-space:nowrap;z-index:5}
.cb:after{content:"";position:absolute;left:34px;bottom:-22px;border:12px solid transparent;border-top:14px solid #10141E}
.cb b{display:block;font-family:Anton;font-size:28px;letter-spacing:1px;font-weight:normal}
.cb i{display:block;font-style:normal;font-family:Rama,NotoTe,InterB;font-size:40px;line-height:1.2;color:#10141E}
#cq{position:absolute;top:300px;left:30px;right:30px;text-align:center;opacity:0;z-index:5}

/* share (L12) */
#share{position:absolute;top:880px;left:0;right:0;text-align:center;opacity:0;z-index:5}
#share .sb{display:inline-flex;align-items:center;gap:22px;font-family:Anton;font-size:64px;letter-spacing:3px;color:#10141E;background:#FFD54F;border:6px solid #10141E;border-radius:26px;box-shadow:0 10px 0 #10141E;padding:10px 40px}
#share svg{width:84px;height:84px}
/* end card */
#endc{position:absolute;inset:0;opacity:0;z-index:5;background:linear-gradient(rgba(10,12,28,0) 0%,rgba(10,12,28,.2) 38%,rgba(10,12,28,.86) 52%,rgba(10,12,28,.9) 100%)}
#endc .box{position:absolute;top:930px;left:90px;right:90px;text-align:center}
#endc .eb{display:block;font-family:Anton;font-size:56px;letter-spacing:3px;color:#fff;padding:10px 110px 10px 0;border-radius:24px;border:6px solid #10141E;box-shadow:0 9px 0 #10141E;margin-bottom:34px}
#eF{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF)} #eS{background:#E53935}
#endc .lg{font-family:Anton;font-size:44px;color:#F5B347;letter-spacing:4px;margin-bottom:36px}
#endc .nx{font-family:Rama,NotoTe;font-size:52px;color:#fff;margin-top:6px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:6}

<div id="cbs"></div>

<div id="endc"><div class="box"><div class="lg">REEL RASAM · @_REELRASAM</div><span class="eb" id="eF">FOLLOW @_REELRASAM</span><span class="eb" id="eS">▶ SUBSCRIBE @REEL_RASAM</span><div class="nx">ఒక్క దీపం... ఎన్నో చేతులు 🪔</div></div></div>
