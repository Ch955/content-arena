name: publish

# Posts at most ONE due approved row per platform per run. Rows carry scheduled_for (riddle 07:30, story/lesson
# 18:30 IST; owner, 9 Nov 2026). GitHub often runs schedules late or skips them, so it checks every 30 minutes
# around both slots (07:00–10:25 and 17:30–21:25 IST); a row posts at the first run after its time.
# Guard: does nothing unless the repo variable PUBLISH_ENABLED is "true".
on:
  schedule:
    - cron: "25,55 1-4 * * *"    # 07:25–10:25 IST
    - cron: "25,55 12-15 * * *"  # 17:55–21:25 IST
  workflow_dispatch:
    inputs:
      live:
        description: "Actually post (otherwise dry run)"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[sheet]"
      - name: Publish next approved row
        env:
          TABLE_BACKEND: sheet
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v23.0' }}
          META_AUTH: ${{ vars.META_AUTH || 'instagram_login' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            python -m content_arena publish --live
          else
            python -m content_arena publish
          fi
